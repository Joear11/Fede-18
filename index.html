function normalizza(str) {
    return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "") // rimuove accenti
        .trim();
}

// distanza di Levenshtein (tolleranza errori)
function distanza(a, b) {
    const matrix = [];

    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }

    return matrix[b.length][a.length];
}

function cercaTavolo() {
    const inputRaw = document.getElementById('nameInput').value;
    const input = normalizza(inputRaw);

    if (!input) {
        alert("Inserisci un nome!");
        return;
    }

    let persona = null;

    // 🔎 1. Match diretto o parziale
    persona = databaseInvitati.find(p =>
        normalizza(p.Nome).includes(input)
    );

    // 🔎 2. Se non trova, prova con tolleranza errori
    if (!persona) {
        let migliore = null;
        let distanzaMin = Infinity;

        databaseInvitati.forEach(p => {
            const nomeNorm = normalizza(p.Nome);
            const d = distanza(input, nomeNorm);

            if (d < distanzaMin) {
                distanzaMin = d;
                migliore = p;
            }
        });

        // soglia errore (più basso = più preciso)
        if (distanzaMin <= 3) {
            persona = migliore;
        }
    }

    if (persona) {
        document.getElementById('tableName').innerText = persona.Tavolo;

        const compagni = databaseInvitati.filter(p =>
            p.Tavolo === persona.Tavolo &&
            normalizza(p.Nome) !== normalizza(persona.Nome)
        );

        document.getElementById('guestsList').innerHTML =
            compagni.map(c => `<li>🌸 ${c.Nome}</li>`).join('');

        document.getElementById('result').style.display = 'block';
    } else {
        alert("Nome non trovato.");
    }
}
